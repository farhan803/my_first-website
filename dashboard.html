<!DOCTYPE html>
<html>
<head>
<title>Dashboard</title>

<style>
body{
  font-family: Arial;
  background:#0a142d;
  color:white;
  text-align:center;
}

input, button{
  padding:10px;
  margin:10px;
  border-radius:10px;
  border:none;
}

button{
  background:#00f7ff;
  cursor:pointer;
}

.projects{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
  gap:20px;
  padding:20px;
}

.project-card{
  background:#111;
  padding:15px;
  border-radius:15px;
}

.project-card img{
  width:100%;
  border-radius:10px;
}

.buttons a{
  display:inline-block;
  margin:5px;
  padding:5px 10px;
  background:#00f7ff;
  color:black;
  text-decoration:none;
  border-radius:10px;
}
</style>

</head>

<body>

<h2>Dashboard</h2>

<input type="text" id="project" placeholder="Project Name">
<button onclick="addProject()">Add</button>

<!-- FIX: ul → div -->
<div class="projects" id="projects-list"></div>

<script>
let projects = [
  {
    title: "calculator",
    image: "https://via.placeholder.com/300",
    category: "web",
    live: "#",
    github: "#"
  }
];

const container = document.getElementById("projects-list");

//  SHOW PROJECT
function showProjects() {
  container.innerHTML = "";

  projects.forEach(project => {
    const div = document.createElement("div");
    div.classList.add("project-card");

    div.innerHTML = `
      <img src="${project.image}">
      <h3>${project.title}</h3>

      <div class="buttons">
        <a href="${project.live}" target="_blank">Live</a>
        <a href="${project.github}" target="_blank">GitHub</a>
      </div>
    `;

    container.appendChild(div);
  });
}

// ADD PROJECT
function addProject() {
  const name = document.getElementById("project").value;

  if(name === "") {
    alert("Enter project name!");
    return;
  }

  const newProject = {
    title: name,
    image: "https://via.placeholder.com/300",
    category: "custom",
    live: "#",
    github: "#"
  };

  projects.push(newProject);

  document.getElementById("project").value = "";

  showProjects();
}

// first load
showProjects();
</script>
<script>let projects = [
  {
    title: "HTML Demo",
    code: `<h1 style="color:red;">Hello Farhan</h1>`
  },
  {
    title: "Button Design",
    code: `<button style="background:blue;color:white;">Click Me</button>`
  }
];
const container = document.getElementById("projects-list");

function showProjects() {
  container.innerHTML = "";

  projects.forEach(project => {
    const div = document.createElement("div");
    div.classList.add("project-card");

    div.innerHTML = `
      <h3>${project.title}</h3>

      <pre><code>${project.code}</code></pre>

      <button onclick='runCode(\`${project.code}\`)'>▶ Run</button>
    `;

    container.appendChild(div);
  });
}

showProjects();
function runCode(code) {
  const win = window.open("", "_blank");

  win.document.open();
  win.document.write(code);
  win.document.close();
}
</script>

</body>
</html>
