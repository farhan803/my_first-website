<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register Form</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Segoe UI',sans-serif;
}

body{
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:linear-gradient(135deg,#0f172a,#1e293b);
}

.register-box{
  width:400px;
  background:rgba(255,255,255,0.08);
  backdrop-filter:blur(10px);
  padding:40px;
  border-radius:20px;
  box-shadow:0 10px 30px rgba(0,0,0,0.4);
  color:white;
}

.register-box h2{
  text-align:center;
  margin-bottom:30px;
  font-size:30px;
}

.input-box{
  margin-bottom:18px;
}

.input-box input{
  width:100%;
  padding:14px;
  border:none;
  outline:none;
  border-radius:10px;
  background:rgba(255,255,255,0.1);
  color:white;
  font-size:16px;
}

.input-box input::placeholder{
  color:#ddd;
}

.register-btn{
  width:100%;
  padding:14px;
  border:none;
  border-radius:10px;
  background:#2563eb;
  color:white;
  font-size:17px;
  cursor:pointer;
  transition:0.3s;
}

.register-btn:hover{
  background:#1d4ed8;
}

.extra{
  margin-top:15px;
  text-align:center;
  font-size:14px;
}

.extra a{
  color:#60a5fa;
  text-decoration:none;
}
</style>
</head>

<body>

<div class="register-box">
  <h2>Create Account</h2>

  <form>

    <div class="input-box">
      <input type="text" placeholder="Full Name" required>
    </div>

    <div class="input-box">
      <input type="email" placeholder="Email Address" required>
    </div>

    <div class="input-box">
      <input type="password" placeholder="Password" required>
    </div>

    <div class="input-box">
      <input type="password" placeholder="Confirm Password" required>
    </div>

    <button class="register-btn">Register</button>

    <div class="extra">
      Already have an account?
      <a href="login.html">Login</a>
    </div>

  </form>
</div>

</body>
</html>
